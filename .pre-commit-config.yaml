# Install with `uv run poe setup`. mypy and pytest run in `uv run poe check`.
# Vendored files stay byte for byte as published (src/fns/report/vendor/README.md).
exclude: ^src/fns/report/vendor/.*\.(js|LICENSE)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^fixtures/  # recorded lab runs; scanned by test_no_real_ids instead
      - id: check-merge-conflict
  # Ruff runs from the project environment so its version comes from uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
