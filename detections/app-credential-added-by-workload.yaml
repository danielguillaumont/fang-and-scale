# Detection rule (M4 K3). Structural tests: tests/harden/test_detections.py
id: app-credential-added-by-workload
title: Credential added to an application or service principal by a workload identity
description: >-
  A service principal added a certificate or secret to an application or a service principal. This is the first hop of the owner-adds-credential escalation, and of Application.ReadWrite.All or an Application Administrator role used the same way. A key's delete logs the same operation name, so the key lists in modifiedProperties decide; when they can't tell (Change = unknown), the rule still alerts.
severity: High
tactics: [Persistence, PrivilegeEscalation]
covers:
  - "rule:owner-adds-credential"
  - "rule:app-readwrite-all"
  - "rule:app-admin-role"
  - "op:directory:applications/credentials/update"
  - "op:application:credentials/update"
  - "op:servicePrincipal:credentials/update"
tables: [AuditLogs]
query_frequency: PT15M
query_period: PT1H
entities:
  Account: InitiatingAppId
query: |
  AuditLogs
  | where OperationName has "Certificates and secrets management"
      or OperationName =~ "Add service principal credentials"
  | where Result =~ "success"
  | extend InitiatingAppId = tostring(InitiatedBy.app.servicePrincipalId)
  | where isnotempty(InitiatingAppId)
  | extend TargetObjectId = tostring(TargetResources[0].id)
  // Adding and deleting a key log the same OperationName (FINDINGS, 2026-11-27).
  // Count the keys before and after; drop only a change known to be a delete.
  | mv-apply Prop = TargetResources[0].modifiedProperties on (
      summarize
        KeysBefore = sumif(array_length(todynamic(tostring(Prop.oldValue))), tostring(Prop.displayName) == "KeyDescription"),
        KeysAfter = sumif(array_length(todynamic(tostring(Prop.newValue))), tostring(Prop.displayName) == "KeyDescription")
    )
  | extend Change = case(KeysAfter > KeysBefore, "add", KeysAfter < KeysBefore, "delete", "unknown")
  | where Change != "delete"
  | project TimeGenerated, InitiatingAppId, TargetObjectId, OperationName, Change, CorrelationId
