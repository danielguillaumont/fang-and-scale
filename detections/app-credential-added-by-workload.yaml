# Detection rule (M4 K3). Structural tests: tests/harden/test_detections.py
id: app-credential-added-by-workload
title: Credential added to an application by a workload identity
description: >-
  A service principal added a certificate or secret to an application. This is the first hop of the owner-adds-credential escalation, and of Application.ReadWrite.All or an Application Administrator role used the same way.
severity: High
tactics: [Persistence, PrivilegeEscalation]
covers:
  - "rule:owner-adds-credential"
  - "rule:app-readwrite-all"
  - "rule:app-admin-role"
  - "op:directory:applications/credentials/update"
tables: [AuditLogs]
query_frequency: PT15M
query_period: PT1H
entities:
  Account: InitiatingAppId
query: |
  AuditLogs
  | where OperationName has "Certificates and secrets management"
  | where Result =~ "success"
  | extend InitiatingAppId = tostring(InitiatedBy.app.servicePrincipalId)
  | where isnotempty(InitiatingAppId)
  | extend TargetAppObjectId = tostring(TargetResources[0].id)
  | project TimeGenerated, InitiatingAppId, TargetAppObjectId, OperationName, CorrelationId
