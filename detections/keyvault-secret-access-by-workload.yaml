# Detection rule (M4 K3). Structural tests: tests/harden/test_detections.py
id: keyvault-secret-access-by-workload
title: Key Vault secret accessed by a monitored workload
description: >-
  A monitored workload identity read, listed or set a secret. Requires the vault's AuditEvent diagnostic logs in the workspace.
severity: Medium
tactics: [CredentialAccess, Collection]
covers:
  - "op:resource:secrets/get"
  - "op:resource:secrets/list"
  - "op:resource:secrets/set"
tables: [AzureDiagnostics]
query_frequency: PT15M
query_period: PT1H
entities:
  Account: CallerObjectId
  AzureResource: ResourceId
parameters:
  monitored_identities: >-
    KQL dynamic array of object IDs to watch, e.g. ["<guid>"] (the workload identities a contract assumes compromised)
query: |
  let MonitoredIdentities = dynamic({{monitored_identities}});
  AzureDiagnostics
  | where ResourceProvider == "MICROSOFT.KEYVAULT" and Category == "AuditEvent"
  | where OperationName in ("SecretGet", "SecretList", "SecretSet")
  | where ResultSignature == "OK"
  | where identity_claim_oid_g in~ (MonitoredIdentities)
  | extend CallerObjectId = identity_claim_oid_g, ResourceId = _ResourceId
  | project TimeGenerated, CallerObjectId, ResourceId, OperationName, CorrelationId
