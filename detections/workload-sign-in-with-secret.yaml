# Detection rule (M4 K3). Structural tests: tests/harden/test_detections.py
id: workload-sign-in-with-secret
title: Monitored workload identity signed in with something other than a key
description: >-
  A monitored workload identity signed in successfully with a client secret, or with any credential that is not a key-based assertion, a federated credential or a managed identity. The lab's identities sign in with certificates, which Entra logs as clientAssertion (FINDINGS, 2026-11-27), so a password added by an owner (the owner-adds-credential escalation, strike S4) shows up here when it is used.
severity: Medium
tactics: [InitialAccess, PrivilegeEscalation]
covers:
  - "rule:owner-adds-credential"
  - "rule:app-readwrite-all"
  - "op:application:credentials/update"
tables: [AADServicePrincipalSignInLogs]
query_frequency: PT15M
query_period: PT1H
entities:
  Account: ServicePrincipalId
parameters:
  monitored_identities: >-
    KQL dynamic array of object IDs to watch, e.g. ["<guid>"] (the workload identities a contract assumes compromised)
query: |
  let MonitoredIdentities = dynamic({{monitored_identities}});
  AADServicePrincipalSignInLogs
  | where ResultType == "0"
  | where ServicePrincipalId in~ (MonitoredIdentities)
  | where ClientCredentialType !in~ ("clientAssertion", "federatedIdentityCredential", "managedIdentity")
  | project TimeGenerated, ServicePrincipalId, ServicePrincipalName, ClientCredentialType, ResourceDisplayName, CorrelationId
