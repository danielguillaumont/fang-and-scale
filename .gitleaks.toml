# gitleaks configuration: the default rules plus three reviewed false positives
# (full-history scan, gitleaks 8.30.1, 2026-11-26; see docs/PUBLIC-READINESS.md).
# Run: gitleaks git --log-opts="--all" --redact .
[extend]
useDefault = true

[[allowlists]]
description = "Reviewed false positives, matched exactly; nothing broader"
regexTarget = "match"
regexes = [
  # mutation-test keys: "listkeys:<storage account name>"
  '''listkeys:st[a-z0-9]{3,22}"''',
  # a type annotation in src/fns/verify/signing.py
  '''key: Ed25519PrivateKey''',
  # the synthetic JWT in tests/fixtures/test_sanitize.py: {"alg":"RS256"}.{"sub":"1234567890"}."signature-bytes"
  '''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.c2lnbmF0dXJlLWJ5dGVz''',
]
