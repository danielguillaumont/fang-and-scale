# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
# Every PR still has to pass `ci` (poe check on ubuntu and windows).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: terraform
    directory: /lab
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "chore(lab)"
